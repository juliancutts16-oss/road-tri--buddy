# Netlify reads this when you connect the project.
# The "public" folder is the website (home page, privacy policy, sounds for the Flutter app); the server helpers
# that hold the secret keys are in netlify/functions.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Make sure phones always pick up the latest home page and clean-up helper (sw.js).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
