<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWTY – Are We There Yet?</title>
<meta name="description" content="A road-trip app for children: a moving map, miles and time left, the car on the road and gentle music. Coming soon to Android.">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#F5F7FC;--surface:#FFFFFF;--ink:#14203F;--muted:#56627F;--line:#D9E0EF;--blue:#1E3A8A}
  @media (prefers-color-scheme:dark){:root{--bg:#0E1426;--surface:#161E36;--ink:#E9EEFB;--muted:#9BA6C4;--line:#2A3558;--blue:#9DB6FF}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,'Times New Roman',Times,serif}
  main{max-width:640px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));text-align:center}
  img{width:112px;height:112px;border-radius:24px}
  h1{font-size:2rem;line-height:1.15;margin:20px 0 8px;color:var(--blue)}
  p{margin:0 auto 14px;max-width:52ch}
  .muted{color:var(--muted)}
  a{color:var(--blue)}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="AWTY app icon">
  <h1>AWTY – Are We There Yet?</h1>
  <p>A road-trip app for children. It shows how far there is to go on a car journey: a moving map, the miles and time left, the car on the road and gentle music.</p>
  <p><b>Coming soon to Android on Google Play.</b></p>

  <p class="muted"><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
