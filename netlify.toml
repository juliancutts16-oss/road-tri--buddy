# Netlify reads this when you connect the project.
# The app itself is the "public" folder; the secret-key helpers are in netlify/functions.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Lets the storyteller voice use several of the phone's processor cores (about 1.6x faster). "credentialless"
# still lets Google Fonts and the voice files load from other sites.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Make sure phones always pick up new versions of the app and its offline worker.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
